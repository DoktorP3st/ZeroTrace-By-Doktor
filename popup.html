<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ZeroTrace</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <header>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        <div class="logo-text">
          <span class="logo-name">ZeroTrace</span>
          <span class="logo-sub">by Pestovich</span>
        </div>
      </div>
    </header>

    <section class="current-site">
      <div class="site-row">
        <div class="site-favicon">🌐</div>
        <span id="current-domain" class="domain-label">Loading...</span>
      </div>
      <button id="shield-btn" class="shield-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span id="shield-label" data-i18n="protect">Protect</span>
      </button>
    </section>

    <section class="categories-section">
      <div class="section-header">
        <span class="section-title" data-i18n="what_to_clean">WHAT TO CLEAN</span>
        <select id="time-range" class="time-select">
          <option value="1h" data-i18n="time_1h">1 heure</option>
          <option value="24h" data-i18n="time_24h">24 heures</option>
          <option value="7d" data-i18n="time_7d">7 jours</option>
          <option value="all" selected data-i18n="time_all">Tout</option>
        </select>
      </div>
      <div class="categories">

        <label class="cat-item">
          <input type="checkbox" name="cat" value="history" checked>
          <div class="cat-body">
            <span class="cat-icon">🕵️</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_history_name">Navigation Trail</span>
              <span class="cat-desc" data-i18n="cat_history_desc">Browsing &amp; search history</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="downloads" checked>
          <div class="cat-body">
            <span class="cat-icon">📥</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_downloads_name">Downloads</span>
              <span class="cat-desc" data-i18n="cat_downloads_desc">Download history list</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="cache" checked>
          <div class="cat-body">
            <span class="cat-icon">🗄️</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_cache_name">Web Cache</span>
              <span class="cat-desc" data-i18n="cat_cache_desc">Cached files &amp; service workers</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="cookies" checked>
          <div class="cat-body">
            <span class="cat-icon">🍪</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_cookies_name">Cookies &amp; Sessions</span>
              <span class="cat-desc" data-i18n="cat_cookies_desc">Login data (whitelist safe)</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="localStorage" checked>
          <div class="cat-body">
            <span class="cat-icon">💾</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_localstorage_name">LocalStorage</span>
              <span class="cat-desc" data-i18n="cat_localstorage_desc">Site preferences &amp; data</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="indexedDB" checked>
          <div class="cat-body">
            <span class="cat-icon">🗃️</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_indexeddb_name">IndexedDB</span>
              <span class="cat-desc" data-i18n="cat_indexeddb_desc">Offline databases &amp; PWA data</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

        <label class="cat-item">
          <input type="checkbox" name="cat" value="forms">
          <div class="cat-body">
            <span class="cat-icon">📋</span>
            <div class="cat-info">
              <span class="cat-name" data-i18n="cat_forms_name">Forms &amp; Passwords</span>
              <span class="cat-desc" data-i18n="cat_forms_desc">Autofill &amp; saved passwords</span>
            </div>
          </div>
          <div class="toggle-track"><div class="toggle-thumb"></div></div>
        </label>

      </div>
    </section>

    <section class="action-section">
      <button id="clean-btn" class="clean-btn">
        <svg class="clean-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        <span data-i18n="clean_all">CLEAN ALL</span>
      </button>

      <button id="secure-close-btn" class="secure-close-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <span data-i18n="secure_close">Secure close</span>
      </button>

      <div id="status" class="status hidden"></div>

      <div class="bottom-row">
        <button id="settings-btn" class="settings-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span data-i18n="manage_protected">Manage protected sites</span>
          <span id="wl-count-badge" class="wl-count-badge">0</span>
        </button>
        <button id="incognito-btn" class="incognito-btn" title="Open incognito window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </section>

  </div>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
